<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* Social card, 1200x630. Keep the palette and positioning in sync with the site. */
  :root{
    --bg:#0c0e10; --panel:#13161a; --fg:#d8d4ca; --dim:#7d848c;
    --amber:#f0a500; --teal:#54c7ab; --line:#22272d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  body{
    background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--fg);
    display:flex; align-items:center; justify-content:center;
  }

  .term{
    width:1076px; height:518px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  .bar{
    height:62px; flex:none;
    display:flex; align-items:center;
    padding:0 26px;
    border-bottom:1px solid var(--line);
  }
  .path{ color:var(--fg); font-size:19px; font-weight:600; }

  .body{ flex:1; padding:50px 46px 0; position:relative; }

  h1{
    font-size:66px; font-weight:700; letter-spacing:-2px;
    margin:0 0 16px; white-space:nowrap;
  }
  .role{ color:var(--amber); font-size:31px; font-weight:600; letter-spacing:-1px; }
  .meta{ color:var(--dim); font-size:22px; margin-top:20px; letter-spacing:-.4px; }

  .badge{
    display:inline-block; margin-top:26px;
    border:1px solid var(--teal); border-radius:6px;
    padding:9px 15px; color:var(--teal);
    font-size:18px; letter-spacing:-.4px;
  }

  .foot{
    position:absolute; left:46px; right:46px; bottom:22px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .site{ color:var(--teal); font-size:26px; font-weight:500; letter-spacing:-.6px; }
</style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <span class="path">Vladislav Rajtmajer</span>
    </div>
    <div class="body">
      <h1>Vladislav Rajtmajer</h1>
      <p class="role">Senior PHP / Laravel Backend Engineer</p>
      <p class="meta">Production APIs · data integrations · PostgreSQL · Vue.js</p>

      <span class="badge">100% remote · B2B contractor · Europe</span>

      <div class="foot">
        <span class="site">cv.rajtik.com</span>
      </div>
    </div>
  </div>
</body>
</html>
