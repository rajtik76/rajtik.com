<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* Social card, 1200x630. Mirrors the terminal look of the homepage -
     keep the palette in sync with src/pages/index.astro. */
  :root{
    --bg:#0c0e10; --panel:#13161a; --fg:#d8d4ca; --dim:#7d848c;
    --amber:#f0a500; --teal:#54c7ab; --line:#22272d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  body{
    background:var(--bg);
    font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
    color:var(--fg);
    display:flex; align-items:center; justify-content:center;
  }

  .term{
    width:1076px; height:518px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  .bar{
    height:62px; flex:none;
    display:flex; align-items:center; gap:9px;
    padding:0 26px;
    border-bottom:1px solid var(--line);
  }
  .dot{ width:13px; height:13px; border-radius:50%; }
  .r{ background:#ff5f57 } .y{ background:#febc2e } .g{ background:#28c840 }
  .path{ margin-left:16px; color:var(--dim); font-size:19px; letter-spacing:-.3px; }

  .body{ flex:1; padding:34px 46px 0; position:relative; }

  .pr{ font-size:21px; letter-spacing:-.4px; }
  .pr b{ color:var(--teal); font-weight:500; }
  .tilde{ color:#6f8fa8 }
  .cmd{ color:var(--fg) }

  h1{
    font-size:66px; font-weight:700; letter-spacing:-2px;
    margin:26px 0 16px; white-space:nowrap;
  }
  .role{ color:var(--amber); font-size:31px; font-weight:500; letter-spacing:-1px; }
  .meta{ color:var(--dim); font-size:21px; margin-top:14px; letter-spacing:-.4px; }

  .badge{
    display:inline-block; margin-top:26px;
    border:1px solid var(--amber); border-radius:6px;
    padding:9px 15px; color:var(--amber);
    font-size:18px; letter-spacing:-.4px;
  }

  .foot{
    position:absolute; left:46px; right:46px; bottom:22px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .cursor{
    display:inline-block; width:11px; height:23px;
    background:var(--amber); vertical-align:-4px; margin-left:5px;
  }
  .site{ color:var(--teal); font-size:26px; font-weight:500; letter-spacing:-.6px; }
</style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="path">vladislav@rajtik: ~/about</span>
    </div>
    <div class="body">
      <p class="pr"><b>vladislav@rajtik</b>:<span class="tilde">~</span>$ <span class="cmd">whoami</span></p>

      <h1>Vladislav Rajtmajer</h1>
      <p class="role">Senior PHP / Laravel Engineer</p>
      <p class="meta">Laravel · REST APIs · PostgreSQL · Livewire · Vue.js · remote</p>

      <span class="badge">ships across 3 ecosystems: Composer · WordPress.org · npm</span>

      <div class="foot">
        <span class="pr"><b>vladislav@rajtik</b>:<span class="tilde">~</span>$ <span class="cursor"></span></span>
        <span class="site">rajtik.com</span>
      </div>
    </div>
  </div>
</body>
</html>
