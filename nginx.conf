server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # favicon lives with the rest of the brand; browsers still ask for the root path
    location = /favicon.ico { try_files /brand/favicon.ico =404; }
    location = /apple-touch-icon.png { try_files /brand/apple-touch-icon.png =404; }

    # never cache the entry documents
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # hashed Astro assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;
}
